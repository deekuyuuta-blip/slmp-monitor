plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.yuta.slmpmonitor'
    compileSdk 34

    defaultConfig {
        applicationId 'jp.yuta.slmpmonitor'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // 個人利用向け：リリースもデバッグ鍵で署名してそのまま入れられるようにする
            signingConfig signingConfigs.debug
        }
    }
}
