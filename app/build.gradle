plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.yuta.slmpmonitor'
    compileSdk 34

    defaultConfig {
        applicationId 'jp.yuta.slmpmonitor'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // 更新インストールできるよう、毎回同じ鍵で署名する（個人利用のアプリ用）
    signingConfigs {
        fixed {
            storeFile file('slmp-monitor.keystore')
            storePassword 'slmpmonitor'
            keyAlias 'slmp'
            keyPassword 'slmpmonitor'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }
}
