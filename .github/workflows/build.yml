name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04 には Android SDK がプリインストール済み
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk slmp-monitor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: slmp-monitor-apk
          path: slmp-monitor.apk

      # スマホから直接ダウンロードできるよう「latest」リリースに置く
      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest slmp-monitor.apk \
            --title "SLMPモニタ 最新版" \
            --notes "コミット ${GITHUB_SHA::7} からの自動ビルド"
